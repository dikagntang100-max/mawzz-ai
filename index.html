<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAWZZ AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;background:#101a2c;
 border-bottom:1px solid #233653;
 display:flex;align-items:center;gap:12px;
}
.logo{
 width:42px;height:42px;border-radius:13px;
 background:linear-gradient(135deg,#168cff,#654cff);
 display:grid;place-items:center;font-weight:bold;
 font-size:20px;
}
header h2{margin:0;color:#55aaff}
header small{color:#849bb8}
main{
 max-width:800px;margin:auto;padding:20px;
}
.welcome{text-align:center;margin:55px 0 30px}
.welcome h1{font-size:32px}
.welcome span{color:#42a5ff}
.welcome p{color:#8da2bd}
#chat{
 display:flex;flex-direction:column;gap:15px;
 padding-bottom:110px;
}
.msg{
 padding:14px 17px;border-radius:15px;
 max-width:90%;line-height:1.6;
 white-space:pre-wrap;overflow-wrap:anywhere;
}
.user{
 align-self:flex-end;background:#1769bb;
}
.ai{
 align-self:flex-start;background:#17243a;
 border:1px solid #263d5d;
}
.bottom{
 position:fixed;bottom:0;left:0;width:100%;
 padding:15px;background:#080d18;
 border-top:1px solid #233653;
}
.input{
 max-width:800px;margin:auto;display:flex;gap:10px;
}
input{
 flex:1;min-width:0;padding:16px;
 border-radius:14px;border:1px solid #304666;
 background:#111d30;color:white;outline:none;
 font-size:15px;
}
button{
 border:0;border-radius:13px;padding:0 22px;
 background:#168cff;color:white;font-weight:bold;
}
button:disabled{opacity:.5}
.status{text-align:center;color:#7e96b4;font-size:12px;margin-top:9px}
</style>
</head>
<body>

<header>
 <div class="logo">M</div>
 <div>
  <h2>MAWZZ AI</h2>
  <small>Artificial Intelligence Assistant</small>
 </div>
</header>

<main>
 <div class="welcome" id="welcome">
  <h1>Halo, Selamat Datang di <span>MAWZZ AI</span></h1>
  <p>Tanyakan apa saja. Mari kita cari jawabannya!</p>
 </div>
 <div id="chat"></div>
</main>

<div class="bottom">
 <form class="input" id="form">
  <input id="question" placeholder="Tanyakan sesuatu..." autocomplete="off" required>
  <button id="send">Kirim</button>
 </form>
 <div class="status" id="status">MAWZZ AI siap membantu</div>
</div>

<script>
const form=document.getElementById('form');
const input=document.getElementById('question');
const chat=document.getElementById('chat');
const send=document.getElementById('send');
const status=document.getElementById('status');

function bubble(text,type){
 const div=document.createElement('div');
 div.className='msg '+type;
 div.textContent=text;
 chat.appendChild(div);
 window.scrollTo(0,document.body.scrollHeight);
 return div;
}

form.addEventListener('submit',async(e)=>{
 e.preventDefault();
 const message=input.value.trim();
 if(!message)return;

 document.getElementById('welcome').style.display='none';
 bubble(message,'user');
 input.value='';
 send.disabled=true;
 status.textContent='MAWZZ AI sedang berpikir...';

 const reply=bubble('Sedang memproses...','ai');

 try{
  const response=await fetch('/api/chat',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({message})
  });

  const data=await response.json();

  if(!response.ok)throw new Error(data.error||'Terjadi kesalahan');

  reply.textContent=data.reply||'AI tidak memberikan jawaban.';
 }catch(error){
  reply.textContent='Maaf, terjadi kesalahan: '+error.message;
 }
 send.disabled=false;
 status.textContent='MAWZZ AI siap membantu';
 input.focus();
});
</script>
</body>
  </html>
