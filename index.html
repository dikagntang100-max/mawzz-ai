<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAWZZ AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#101a2d;border-bottom:1px solid #263653}
header h2{margin:0;color:#55aaff}
header p{margin:5px 0 0;color:#9eacc2;font-size:13px}
#chat{height:calc(100dvh - 170px);overflow-y:auto;padding:15px}
.msg{padding:13px;margin:12px 0;border-radius:13px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{background:#174c83;margin-left:auto}
.ai{background:#172338;border:1px solid #293c5b}
.copy{display:inline-block;margin-top:10px;padding:7px 12px;border:0;border-radius:7px;background:#2878cf;color:white}
#preview{padding:0 15px;color:#9eacc2;font-size:13px}
footer{position:fixed;bottom:0;width:100%;padding:12px;background:#101a2d;border-top:1px solid #263653}
.controls{display:flex;gap:8px}
input[type=text]{min-width:0;flex:1;padding:13px;border:1px solid #344762;border-radius:10px;background:#080d18;color:white;outline:none}
button{border:0;border-radius:10px;padding:12px;background:#2784e8;color:white;font-weight:bold}
.file{display:inline-block;padding:10px;color:#7dbbff}
#file{display:none}
button:disabled{opacity:.5}
</style>
</head>
<body>

<header>
<h2>MAWZZ AI</h2>
<p>Asisten AI pintar untuk menjawab pertanyaanmu</p>
</header>

<div id="chat">
<div class="msg ai">Halo! Saya MAWZZ AI. Ada yang bisa saya bantu?</div>
</div>

<div id="preview"></div>

<footer>
<div class="controls">
<label class="file" for="file">＋ File</label>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,.txt">
<input id="message" type="text" placeholder="Tulis pertanyaan..." onkeydown="if(event.key==='Enter')send()">
<button id="sendBtn" onclick="send()">Kirim</button>
</div>
</footer>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const fileInput=document.getElementById("file");
const preview=document.getElementById("preview");
const sendBtn=document.getElementById("sendBtn");

let selectedFile=null;

fileInput.addEventListener("change",()=>{
selectedFile=fileInput.files[0]||null;
preview.textContent=selectedFile?"Lampiran: "+selectedFile.name:"";
});

function addMessage(text,type){
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
return div;
}

function addCopyButton(container,text){
const btn=document.createElement("button");
btn.className="copy";
btn.textContent="Salin jawaban";
btn.onclick=async()=>{
try{
await navigator.clipboard.writeText(text);
btn.textContent="Tersalin!";
setTimeout(()=>btn.textContent="Salin jawaban",1500);
}catch(e){
btn.textContent="Gagal menyalin";
}
};
container.appendChild(btn);
}

async function send(){
const message=input.value.trim();
if(!message&&!selectedFile)return;

addMessage(message||"Tolong periksa lampiran ini.","user");
input.value="";
sendBtn.disabled=true;
const loading=addMessage("MAWZZ AI sedang berpikir...","ai");

try{
let image=null;
let fileText=null;
let fileName=null;

if(selectedFile){
fileName=selectedFile.name;

if(selectedFile.size>3*1024*1024){
throw new Error("Ukuran file maksimal 3 MB.");
}

if(selectedFile.type.startsWith("image/")){
image=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(selectedFile);
});
}else if(selectedFile.type==="text/plain"){
fileText=await selectedFile.text();
}else{
throw new Error("Format yang didukung: JPG, PNG, WEBP, dan TXT.");
}
}

const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message,image,fileText,fileName})
});

const data=await response.json();
if(!response.ok)throw new Error(data.error||"Terjadi kesalahan.");

loading.textContent=data.reply||"Tidak ada jawaban.";
addCopyButton(loading,data.reply||"");
}catch(error){
loading.textContent="Error: "+error.message;
}

selectedFile=null;
fileInput.value="";
preview.textContent="";
sendBtn.disabled=false;
chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
</html>
